[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = []
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# No metadata hash: the bytecode, and so the CREATE2 address, depends only on the source.
bytecode_hash = "none"
cbor_metadata = false

[fmt]
line_length = 120
